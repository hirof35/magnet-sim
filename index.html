<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnet Simulator</title>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="ui-panel" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; color: white; font-family: sans-serif;">
      <label>磁力の強さ:</label><br>
      <input type="range" id="strengthSlider" min="0" max="100" value="50">
      
      <div style="margin-top: 15px;">
        <button id="toggleModeBtn" style="padding: 5px 10px; cursor: pointer;">
          Mode: <span id="modeText">Attract (N)</span>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
